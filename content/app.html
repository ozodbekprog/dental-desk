<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dental Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: header (sections, doctor filter, language, theme) over three working areas:
   schedule with a requests inbox, patient list, and a chart with the 3D mouth beside tabs for tooth, visits and a pick-from-lists visit form. */
:root{
  --bg:#eef3f3; --surface:#ffffff; --surface-2:#f4f8f8; --ink:#13262a; --muted:#587076;
  --line:#d6e1e2; --line-strong:#b7cacd;
  --accent:#0c6a72; --accent-ink:#ffffff; --accent-soft:#d8eef0;
  --warn:#a85408; --warn-soft:#fdeedb; --danger:#c3302a; --danger-soft:#fbe3e1; --ok:#1c7549; --ok-soft:#dcf2e5;
  --st-healthy:#efe7d6; --st-issue:#d8413a; --st-restored:#3b73e0; --st-endo:#e09a12; --st-crown:#8450d9; --st-implant:#4e9d2d; --st-missing:#8b979b;
  --gum:#d98a96; --viewer-bg:#e2ebec; --overlay:rgba(10,26,29,.55);
  --font-display:'Manrope','Segoe UI',system-ui,sans-serif;
  --font-body:'Onest','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a1c; --surface:#142325; --surface-2:#192b2e; --ink:#e4eff0; --muted:#8fa8ad;
    --line:#25393c; --line-strong:#375157;
    --accent:#4fc3cb; --accent-ink:#06282b; --accent-soft:#12383c;
    --warn:#f0a35a; --warn-soft:#3a2a14; --danger:#f2766f; --danger-soft:#3b1b1a; --ok:#6fd09b; --ok-soft:#163626;
    --st-healthy:#efe7d6; --st-issue:#ef6a63; --st-restored:#6b9bf2; --st-endo:#f0b73c; --st-crown:#a47df0; --st-implant:#7bc659; --st-missing:#6f8185;
    --gum:#c97582; --viewer-bg:#0a1416; --overlay:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a1c; --surface:#142325; --surface-2:#192b2e; --ink:#e4eff0; --muted:#8fa8ad;
  --line:#25393c; --line-strong:#375157;
  --accent:#4fc3cb; --accent-ink:#06282b; --accent-soft:#12383c;
  --warn:#f0a35a; --warn-soft:#3a2a14; --danger:#f2766f; --danger-soft:#3b1b1a; --ok:#6fd09b; --ok-soft:#163626;
  --st-healthy:#efe7d6; --st-issue:#ef6a63; --st-restored:#6b9bf2; --st-endo:#f0b73c; --st-crown:#a47df0; --st-implant:#7bc659; --st-missing:#6f8185;
  --gum:#c97582; --viewer-bg:#0a1416; --overlay:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand svg{width:28px;height:28px;color:var(--accent);flex:none}
.tabs{display:flex;gap:4px;margin-right:auto;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px}
.who label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sctl{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.sctl button{border:0;background:none;padding:5px 10px;font-weight:700;font-size:13px;min-height:34px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.sctl button:hover{color:var(--ink)}
.sctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sctl svg{width:16px;height:16px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.icon-btn{border:0;background:none;font-size:24px;line-height:1;padding:4px 10px;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=tel],select,textarea{
  width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:16px
}
textarea{min-height:70px;resize:vertical}
select{width:auto;max-width:100%}
.field select{width:100%}
label.lbl,.field>span.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.06em}
.field .lbl+b{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.field{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:grid;gap:14px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13.5px;min-height:34px;text-align:left}
.opt:hover{border-color:var(--accent);color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt.sq{border-radius:8px;min-width:38px;justify-content:center;font-family:var(--font-mono)}

/* notices */
#banner{display:grid;gap:8px;margin-top:12px}
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:10px 14px;border-radius:10px;font-size:14px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice.err{background:var(--danger-soft);color:var(--danger)}
#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast span.err{background:var(--danger);color:#fff}

main{padding-top:20px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.page-head h1{font-size:30px;line-height:1.1}
.page-head .sub{color:var(--muted);margin-top:4px;max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px;display:grid;gap:8px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--font-display);font-size:17px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.tag.online{background:var(--warn-soft);color:var(--warn)}

/* schedule */
.sched{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.datebar .day{font-family:var(--font-display);font-weight:800;font-size:20px;min-width:0;margin:0 6px}
.datebar input[type=date]{width:auto}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.count{display:flex;gap:8px;align-items:baseline;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.count b{font-family:var(--font-mono);font-size:16px;color:var(--ink)}
.appts{display:grid;gap:10px}
.appt{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:12px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:12px;padding:12px 14px}
.appt.s-arrived{border-left-color:var(--warn)}
.appt.s-in-chair{border-left-color:var(--accent)}
.appt.s-done{border-left-color:var(--ok)}
.appt.s-cancelled,.appt.s-no-show{opacity:.62}
.appt .time{font-family:var(--font-mono);font-weight:600;font-size:18px;line-height:1.1}
.appt .time small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.appt .who-line{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
.appt .who-line button{background:none;border:0;padding:0;font-weight:700;font-size:16px;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.appt .who-line button:hover{color:var(--accent)}
.appt .meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.appt .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.s-arrived,.pill.s-requested{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.s-in-chair{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.s-done,.pill.s-confirmed{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.s-declined{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill.s-cancelled,.pill.s-no-show{text-decoration:line-through}
.rail h2{font-size:17px;margin-bottom:10px}
.rail-list{display:grid;gap:6px}
.rail-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rail-item:hover{border-color:var(--accent)}
.rail-item .d{font-family:var(--font-mono);font-size:12.5px;color:var(--accent);font-weight:600;grid-row:span 2;align-self:center;text-align:center;min-width:54px}
.rail-item .n{font-weight:600;overflow-wrap:anywhere}
.rail-item .m{font-size:13px;color:var(--muted)}
.inbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:14px;margin-bottom:16px;display:grid;gap:10px}
.inbox h2{font-size:17px;color:var(--warn)}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.req .meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}

/* patients */
.search-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.search-row input{flex:1 1 240px}
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:42px minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.prow:hover{border-color:var(--accent)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;font-family:var(--font-display)}
.prow .nm{font-weight:700;overflow-wrap:anywhere}
.prow small{display:block;color:var(--muted);font-weight:400}
.prow .cell{font-size:14px;min-width:0}
.prow .cell span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* chart */
.pt-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.pt-head h1{font-size:30px;line-height:1.1}
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:600;margin-bottom:6px}
.back:hover{color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);margin-top:6px}
.alerts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alert{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-weight:700;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat b{font-family:var(--font-display);font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.chart-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.vtools{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px;align-items:center}
.vtools .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gl-host{position:relative;height:clamp(340px,56vh,560px);border-radius:12px;background:var(--viewer-bg);overflow:hidden;border:1px solid var(--line)}
.gl-host canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.gl-host canvas:active{cursor:grabbing}
.gl-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:2;transform:translate(10px,-34px)}
.gl-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 10px}
.numhelp{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px;margin:10px 0}
.numhelp b{color:var(--ink)}
.lr{display:flex;justify-content:space-between;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 3px}
.arch{display:grid;grid-template-columns:repeat(8,minmax(0,1fr)) 10px repeat(8,minmax(0,1fr));gap:3px;margin-bottom:3px}
.tt{--c:var(--line-strong);display:grid;justify-items:center;align-content:center;min-height:46px;padding:2px 0 0;border:1px solid var(--line);border-bottom:4px solid var(--c);background:var(--surface-2);border-radius:6px;font-family:var(--font-mono);min-width:0}
.tt:hover{border-color:var(--accent);border-bottom-color:var(--c)}
.tt .tn{font-size:13px;font-weight:600;line-height:1.2}
.tt .tc{font-size:10px;color:var(--muted);line-height:1.2;min-height:12px}
.tt.sel{background:var(--accent);border-color:var(--accent);border-bottom-color:var(--c);color:var(--accent-ink)}
.tt.sel .tc{color:var(--accent-ink)}
.tt.st-issue{--c:var(--st-issue)} .tt.st-restored{--c:var(--st-restored)} .tt.st-endo{--c:var(--st-endo)}
.tt.st-crown{--c:var(--st-crown)} .tt.st-implant{--c:var(--st-implant)} .tt.st-missing{--c:var(--st-missing);opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px;flex-wrap:wrap}
.seg button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:600;color:var(--muted);margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.fdi{font-family:var(--font-mono);background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:6px;margin-right:6px;font-size:.9em}
.tooth-head h3{font-size:21px;line-height:1.25}
.tooth-sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.tooth-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.tooth-stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.tooth-stats span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tooth-stats b{font-family:var(--font-display);font-size:18px}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));margin-right:6px}
.sdot.st-issue{--c:var(--st-issue)} .sdot.st-restored{--c:var(--st-restored)} .sdot.st-endo{--c:var(--st-endo)}
.sdot.st-crown{--c:var(--st-crown)} .sdot.st-implant{--c:var(--st-implant)} .sdot.st-missing{--c:var(--st-missing)} .sdot.st-healthy{--c:var(--st-healthy)}
.timeline{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:0}
.tl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tl .dt{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.tl .ti{font-weight:700}
.tl .note{font-size:14px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow-wrap:anywhere}
.chip button{border:0;background:none;padding:0 0 0 2px;color:var(--muted);font-size:15px;line-height:1}
.chip button:hover{color:var(--danger)}
.chip em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.sect-title{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:4px 0 6px}
.visit{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:8px}
.visit summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;gap:4px}
.visit summary::-webkit-details-marker{display:none}
.visit .vh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.visit .vh b{font-family:var(--font-mono);font-size:13.5px}
.visit .body{padding:0 12px 12px;display:grid;gap:8px}
.vproc{border-top:1px solid var(--line);padding-top:8px}
.vproc .t{font-weight:700}
.vact{display:flex;gap:8px;flex-wrap:wrap}

/* visit form */
.sel-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:14px}
.prow-form{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:grid;gap:12px;position:relative}
.prow-form .rm{position:absolute;top:6px;right:6px}
.toolgroup{margin-top:8px}
.toolgroup h4{margin:0 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
details.more{border-top:1px dashed var(--line-strong);padding-top:8px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:13.5px}
.form-err{color:var(--danger);font-weight:600;min-height:20px}
.foot-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.addtool{display:flex;gap:6px}
.addtool input{min-height:34px;font-size:14px}

/* booking */
.book{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.step{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:12px}
.step+.step{margin-top:12px}
.step h3{font-size:16px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.docbtn{display:grid;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 12px}
.docbtn:hover{border-color:var(--accent)}
.docbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.docbtn b{font-family:var(--font-display)}
.docbtn span{color:var(--muted);font-size:13px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.slot{padding:8px 4px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-family:var(--font-mono);font-weight:600;font-size:14px}
.slot:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed;background:var(--surface-2)}
.myreq{display:grid;gap:8px}
.myreq .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--surface-2)}

/* reception & call centre */
.qlink{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.qlink b{font-family:var(--font-display);display:block}
.qlink div>span{display:block}
.qlink div>span+span{margin-top:2px}
.qlink .mono{display:inline-block;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px;margin-top:4px;max-width:100%;overflow-wrap:anywhere}
.qstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.qstat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
.qstat span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.qstat b{font-family:var(--font-display);font-size:22px;line-height:1.2}
.qstat.new b{color:var(--warn)}
.qstat.contacted b{color:var(--accent)}
.qstat.confirmed b{color:var(--ok)}
.qstat.declined b{color:var(--danger)}
.qfilters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.qfilter{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px;min-height:32px}
.qfilter:hover{border-color:var(--accent);color:var(--accent)}
.qfilter[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qfilter i{font-style:normal;font-family:var(--font-mono);opacity:.72;margin-left:4px}
.qsearch{flex:1 1 220px;max-width:300px;margin-left:auto}
.qsearch input{min-height:34px;font-size:14px}
.qlist{display:grid;gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:start}
.qcard.q-requested{border-left-color:var(--warn)}
.qcard.q-contacted{border-left-color:var(--accent)}
.qcard.q-confirmed{border-left-color:var(--ok)}
.qcard.q-declined{opacity:.68}
.qhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.qhead .nm{font-family:var(--font-display);font-weight:800;font-size:17px}
.qhead .age{font-size:12.5px;color:var(--muted)}
.qphone{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.qphone:hover{text-decoration:underline}
.qinfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;margin-top:10px}
.qinfo div{min-width:0}
.qinfo span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.qinfo b{font-weight:600;overflow-wrap:anywhere}
.qlog{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:5px}
.qlog .qlt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.qlog .ql{font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.qlog .ql b{color:var(--accent)}
.qlog .ql span,.qlog .ql small{color:var(--muted);font-size:12px}
.qlog .ql em{font-style:normal;overflow-wrap:anywhere}
.qacts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-content:flex-start;max-width:340px}
.qbrief{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:2px}
.qbrief b{font-family:var(--font-display);font-size:16px}
.qbrief .muted{font-size:13.5px}
.pill.s-contacted{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tab .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;margin-left:6px;font-family:var(--font-mono)}
.app-foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 22px;justify-content:flex-start}

/* modal */
[hidden]{display:none !important}
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:16px;border:1px solid var(--line);width:min(600px,100%);max-height:100%;overflow:auto;padding:18px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:22px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.results{display:grid;gap:4px;margin-top:6px;max-height:210px;overflow:auto}
.results button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.results button:hover{border-color:var(--accent)}
.chosen{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;font-weight:600}
.radios input{width:auto;min-height:0}
.inline-warn{color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:8px;font-size:14px}
.dr-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

@media (max-width:980px){
  .sched,.book{grid-template-columns:minmax(0,1fr)}
  .chart-grid{grid-template-columns:minmax(0,1fr)}
  .stats,.qstats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .appt{grid-template-columns:64px minmax(0,1fr)}
  .appt .acts{grid-column:1 / -1;justify-content:flex-start}
  .prow{grid-template-columns:42px minmax(0,1fr)}
  .prow .cell{grid-column:2}
  .page-head h1,.pt-head h1{font-size:25px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .tl{grid-template-columns:minmax(0,1fr);gap:2px}
  .tt .tn{font-size:11px}
  .req{grid-template-columns:minmax(0,1fr)}
  .tools{width:100%}
  .qcard{grid-template-columns:minmax(0,1fr)}
  .qinfo{grid-template-columns:minmax(0,1fr)}
  .qacts{justify-content:flex-start;max-width:none}
  .qsearch{max-width:none;margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
